name: label

# A change to the ledger widens an escape hatch in the layout audit, so the reviewer is told rather
# than left to notice it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # This runs with a write token, so nothing from the pull request head is checked out or run.
      - uses: actions/labeler@v5
        with:
          sync-labels: true
