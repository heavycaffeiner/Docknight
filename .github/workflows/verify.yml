name: verify

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the running one pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LAYOUT_SHARDS: 4

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install

      - run: pnpm run typecheck
      - run: pnpm run lint:style
      - run: pnpm run lint:js
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install

      - run: pnpm run build:verify

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist
          retention-days: 1

  layout:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test --project layout --shard=${{ matrix.shard }}/${{ env.LAYOUT_SHARDS }}

      # A passing run's exemption ledger is what shows the escape hatches growing, so the report is
      # kept either way.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-layout-${{ matrix.shard }}
          path: |
            test-results
            design/exemption-usage.json
          retention-days: 14

  a11y:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:a11y

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-a11y
          path: test-results
          retention-days: 14

  # One required check to protect the branch with, instead of a list that has to be edited whenever a
  # shard is added.
  gate:
    if: always()
    needs: [static, build, layout, a11y]
    runs-on: ubuntu-latest
    steps:
      # Skipped counts as failure: nothing here is conditional, so a skip means a dependency died and
      # its own result never propagates to this job.
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"result": *"(failure|cancelled|skipped)"' <<< "$RESULTS"; then exit 1; fi
