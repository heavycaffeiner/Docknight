name: verify

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the running one pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LAYOUT_SHARDS: 4

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install

      - run: pnpm run typecheck
      - run: pnpm run lint:style
      - run: pnpm run lint:js
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install

      - run: pnpm run build:verify

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist
          retention-days: 1

  layout:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test --project layout --shard=${{ matrix.shard }}/${{ env.LAYOUT_SHARDS }}

      # A passing run's exemption ledger is what shows the escape hatches growing, so the report is
      # kept either way.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-layout-${{ matrix.shard }}
          path: |
            test-results
            design/exemption-usage.json
          retention-days: 14

  a11y:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:a11y

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-a11y
          path: test-results
          retention-days: 14

  # Built on every commit so a Dockerfile break is caught by the same run that catches a test break.
  # Only main publishes; a pull request build proves the image still assembles and stops there.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # arm64 is emulated. Only the native module is compiled under it, because the frontend stage
      # is pinned to the build platform.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One required check to protect the branch with, instead of a list that has to be edited whenever a
  # shard is added.
  gate:
    if: always()
    needs: [static, build, layout, a11y, image]
    runs-on: ubuntu-latest
    steps:
      # Skipped counts as failure: nothing here is conditional, so a skip means a dependency died and
      # its own result never propagates to this job.
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"result": *"(failure|cancelled|skipped)"' <<< "$RESULTS"; then exit 1; fi
