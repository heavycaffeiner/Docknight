name: verify

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the running one pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  LAYOUT_SHARDS: 4

jobs:
  # Everything downstream runs inside this image, so the browser build and the font set are the same
  # ones the baselines were captured with. The tag is the hash of the image definition, which makes a
  # rebuild happen exactly when the definition changes.
  image:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: |
          hash=${{ hashFiles('docker/verify.Dockerfile', 'docker/verify-fonts.conf') }}
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/verify:${hash:0:16}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/verify.Dockerfile
          tags: ${{ steps.tag.outputs.ref }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  static:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install

      - run: pnpm run typecheck
      - run: pnpm run lint:style
      - run: pnpm run lint:js
      - run: pnpm test

  build:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install

      - run: pnpm run build:verify

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist
          retention-days: 1

  layout:
    needs: [image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - run: pnpm exec playwright test --project layout --shard=${{ matrix.shard }}/${{ env.LAYOUT_SHARDS }}

      # A passing run's exemption ledger is what shows the escape hatches growing, so the report is
      # kept either way.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-layout-${{ matrix.shard }}
          path: |
            test-results
            design/exemption-usage.json
          retention-days: 14

  visual:
    needs: [image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - run: pnpm run test:visual

      # Baseline, actual and diff images for every mismatch.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-visual
          path: test-results
          retention-days: 14

  a11y:
    needs: [image, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - run: pnpm run test:a11y

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-a11y
          path: test-results
          retention-days: 14

  # One required check to protect the branch with, instead of a list that has to be edited whenever a
  # shard is added.
  gate:
    if: always()
    needs: [static, build, layout, visual, a11y]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"result": *"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
