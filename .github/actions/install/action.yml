name: install
description: Provision Node and pnpm, then install dependencies from the lockfile.

runs:
  using: composite
  steps:
    # pnpm first: setup-node's pnpm cache needs the store path, which only exists once pnpm does.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile
