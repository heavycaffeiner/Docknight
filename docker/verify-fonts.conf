<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!--
        The bundle carries Noto Sans as a web font, so these aliases only catch what it does not
        style: a platform family named by a dependency, and the generic fallback at the end of every
        stack. Without them fontconfig answers with whatever the image happens to hold, and every
        baseline shifts when the base image changes.
    -->
    <alias binding="same">
        <family>system-ui</family>
        <prefer><family>Noto Sans</family></prefer>
    </alias>
    <alias binding="same">
        <family>-apple-system</family>
        <prefer><family>Noto Sans</family></prefer>
    </alias>
    <alias binding="same">
        <family>Segoe UI</family>
        <prefer><family>Noto Sans</family></prefer>
    </alias>
    <alias binding="same">
        <family>Roboto</family>
        <prefer><family>Noto Sans</family></prefer>
    </alias>
    <alias binding="same">
        <family>sans-serif</family>
        <prefer><family>Noto Sans</family></prefer>
    </alias>

    <!-- The bundled Korean face wins for text the app styles; this covers everything else. -->
    <alias binding="same">
        <family>Noto Sans KR</family>
        <prefer><family>Noto Sans CJK KR</family></prefer>
    </alias>

    <!--
        JetBrains Mono arrives as a web font from the bundle, so the generic monospace families only
        have to be deterministic for text the bundle does not style.
    -->
    <alias binding="same">
        <family>ui-monospace</family>
        <prefer><family>Liberation Mono</family></prefer>
    </alias>
    <alias binding="same">
        <family>SFMono-Regular</family>
        <prefer><family>Liberation Mono</family></prefer>
    </alias>
    <alias binding="same">
        <family>Menlo</family>
        <prefer><family>Liberation Mono</family></prefer>
    </alias>
    <alias binding="same">
        <family>monospace</family>
        <prefer><family>Liberation Mono</family></prefer>
    </alias>

    <!-- Subpixel geometry and hinting are part of the compared image. -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        <edit name="rgba" mode="assign"><const>none</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    </match>
</fontconfig>
