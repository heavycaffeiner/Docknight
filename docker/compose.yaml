# First-time deployment:
# 1. Copy this file to /opt/docknight/compose.yaml.
# 2. Create /opt/docknight for Docknight data and /opt/stacks for managed stacks.
# 3. Run `docker compose -f /opt/docknight/compose.yaml up -d`.
#
# Every managed stack lives directly below /opt/stacks. Keep the /opt/stacks mount at the same
# absolute path inside the container and on the host. Docker resolves stack bind-mount paths on
# the host.
services:
  docknight:
    # stable follows the newest release. Use a version tag when an installation must stay pinned.
    image: ghcr.io/heavycaffeiner/docknight:stable
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/docknight:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      - DOCKNIGHT_STACKS_DIR=/opt/stacks
